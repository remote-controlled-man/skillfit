<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">skillfit evidence loop</title>
  <desc id="desc">Discover agent configuration, preflight it, run paired baseline and treatment tasks, calculate a verdict, then install only configurations supported by evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="160" fill="#6d5dfc" opacity=".08"/>
  <circle cx="110" cy="470" r="190" fill="#35d0ba" opacity=".06"/>

  <text x="70" y="82" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Stop guessing which agent config helps.</text>
  <text x="70" y="119" fill="#a9b6cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Run the same task twice. Change one thing. Keep the evidence.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="290" height="270" rx="18" fill="#0e1a2d" stroke="#263754"/>
    <rect x="70" y="170" width="290" height="42" rx="18" fill="#17243a"/>
    <circle cx="94" cy="191" r="6" fill="#ff6b6b"/><circle cx="114" cy="191" r="6" fill="#ffd166"/><circle cx="134" cy="191" r="6" fill="#4fd1c5"/>
    <text x="92" y="252" fill="#7ee7dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">$ skillfit eval ./context7</text>
    <text x="92" y="283" fill="#a9b6cc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Target   : context7 (mcp)</text>
    <text x="92" y="311" fill="#a9b6cc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Bench    : docs-lookup</text>
    <text x="92" y="339" fill="#a9b6cc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Baseline : 9/20</text>
    <text x="92" y="367" fill="#a9b6cc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">Treatment: 16/20</text>
    <text x="92" y="407" fill="#8ca8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700">Verdict  : evidence, not hype</text>
  </g>

  <path d="M390 305 H435" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M428 296 L439 305 L428 314" fill="none" stroke="#7c9cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="470" y="176" width="200" height="92" rx="16" fill="#12243b" stroke="#2d4868"/>
    <text x="494" y="211" fill="#6ee7d7" font-size="14" font-weight="700" letter-spacing="1.5">BASELINE</text>
    <text x="494" y="241" fill="#f8fafc" font-size="18">Same task, config off</text>

    <rect x="470" y="338" width="200" height="92" rx="16" fill="#12243b" stroke="#5269b8"/>
    <text x="494" y="373" fill="#9fb0ff" font-size="14" font-weight="700" letter-spacing="1.5">TREATMENT</text>
    <text x="494" y="403" fill="#f8fafc" font-size="18">Same task, config on</text>

    <path d="M570 281 V318" stroke="#6f88d7" stroke-width="3" stroke-dasharray="6 7"/>
    <circle cx="570" cy="305" r="5" fill="#7c9cff"/>
  </g>

  <path d="M700 305 H745" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M738 296 L749 305 L738 314" fill="none" stroke="#7c9cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="780" y="170" width="350" height="270" rx="18" fill="#0e1a2d" stroke="#263754"/>
    <text x="812" y="216" fill="#f8fafc" font-size="22" font-weight="700">Evidence ledger</text>
    <line x1="812" y1="234" x2="1098" y2="234" stroke="#263754"/>

    <circle cx="828" cy="271" r="10" fill="#4fd1c5"/><path d="M823 271 l4 4 7-9" fill="none" stroke="#07131f" stroke-width="3"/>
    <text x="852" y="277" fill="#dbe5f3" font-size="17">Deterministic verifier</text>

    <circle cx="828" cy="316" r="10" fill="#4fd1c5"/><path d="M823 316 l4 4 7-9" fill="none" stroke="#07131f" stroke-width="3"/>
    <text x="852" y="322" fill="#dbe5f3" font-size="17">Paired confidence interval</text>

    <circle cx="828" cy="361" r="10" fill="#4fd1c5"/><path d="M823 361 l4 4 7-9" fill="none" stroke="#07131f" stroke-width="3"/>
    <text x="852" y="367" fill="#dbe5f3" font-size="17">Token and routing cost</text>

    <rect x="812" y="389" width="286" height="30" rx="15" fill="url(#accent)" opacity=".95"/>
    <text x="955" y="410" text-anchor="middle" fill="#08111f" font-size="14" font-weight="800" letter-spacing="1">INSTALL ONLY WHAT SURVIVES</text>
  </g>
</svg>
