# Copy this file into .github/workflows/ and replace the bench paths before enabling it.
# This validates bench integrity offline. It does not measure agent quality.
name: Offline skillfit bench check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js bench check benches/code-review
      - run: node dist/cli.js bench check benches/debugging
      - name: Workflow summary
        if: success()
        shell: bash
        run: |
          echo "## Offline bench checks passed on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This validates bench integrity only; it is not an agent-quality result." >> "$GITHUB_STEP_SUMMARY"
