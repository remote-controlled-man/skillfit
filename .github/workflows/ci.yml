name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Smoke doctor (read-only)
        run: node dist/cli.js doctor
      - name: Bench integrity (offline verifier self-tests)
        run: |
          node dist/cli.js bench check benches/code-review
          node dist/cli.js bench check benches/debugging
      - name: Smoke report (no session history on runners)
        run: node dist/cli.js report --json
