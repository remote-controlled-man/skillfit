name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SKILLFIT_CI_OS: ${{ matrix.os }}
      SKILLFIT_CI_JOB: test
      SKILLFIT_CI_NODE_TARGET: '22'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Classify changed files (unknown changes use full CI)
        id: scope
        run: node scripts/ci-scope.mjs classify
      - run: npm ci
      - run: node scripts/ci-scope.mjs test
      - name: First-run plan (offline, no agent CLI)
        if: steps.scope.outputs.scope == 'full'
        run: |
          node dist/cli.js --help
          node dist/cli.js eval skills/skillfit --bench code-review --agent codex --dry-run
          node dist/cli.js report eval docs/examples/eval-manifest.synthetic.json
          node dist/cli.js install --agent codex --dry-run
      - name: Smoke doctor (read-only)
        if: steps.scope.outputs.scope == 'full'
        run: node dist/cli.js doctor
      - name: Bench integrity (offline verifier self-tests)
        if: steps.scope.outputs.scope == 'full'
        run: |
          node dist/cli.js bench check benches/code-review
          node dist/cli.js bench check benches/debugging
          node scripts/check-contrib-benches.mjs
      - name: Smoke report (no session history on runners)
        if: steps.scope.outputs.scope == 'full'
        run: node dist/cli.js report --json
      - name: Record actual CI scope, status and test counts
        if: always()
        env:
          SKILLFIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-scope.mjs record
      - name: Retain CI evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-result-${{ github.run_attempt }}-test-${{ matrix.os }}-node-22
          path: ${{ runner.temp }}/skillfit-ci/
          if-no-files-found: warn
          retention-days: 90

  node-compat:
    name: node-compat (ubuntu-latest, Node ${{ matrix.node }})
    strategy:
      matrix:
        node: ['22.13.0', '22.14.0', '24', '26']
    runs-on: ubuntu-latest
    env:
      SKILLFIT_CI_OS: ubuntu-latest
      SKILLFIT_CI_JOB: node-compat
      SKILLFIT_CI_NODE_TARGET: ${{ matrix.node }}
      SKILLFIT_CI_FORCE_FULL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/ci-scope.mjs classify
      - run: npm ci
      - run: node scripts/ci-scope.mjs test
      - name: Bench integrity (offline verifier self-tests)
        run: |
          node dist/cli.js bench check benches/code-review
          node dist/cli.js bench check benches/debugging
          node scripts/check-contrib-benches.mjs
      - name: Record actual Node compatibility result
        if: always()
        env:
          SKILLFIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-scope.mjs record
      - name: Retain Node compatibility evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-result-${{ github.run_attempt }}-node-compat-ubuntu-latest-node-${{ matrix.node }}
          path: ${{ runner.temp }}/skillfit-ci/
          if-no-files-found: warn
          retention-days: 90

  node-minimum:
    name: node-minimum (ubuntu-latest, Node 22.0.0)
    runs-on: ubuntu-latest
    env:
      SKILLFIT_CI_OS: ubuntu-latest
      SKILLFIT_CI_JOB: node-minimum
      SKILLFIT_CI_NODE_TARGET: '22.0.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.0.0'
          cache: npm
      - run: node scripts/ci-scope.mjs classify
      - run: npm ci
      - run: node scripts/ci-scope.mjs minimum
      - name: Record actual minimum Node result
        if: always()
        env:
          SKILLFIT_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-scope.mjs record
      - name: Retain minimum Node evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-result-${{ github.run_attempt }}-node-minimum-ubuntu-latest-node-22.0.0
          path: ${{ runner.temp }}/skillfit-ci/
          if-no-files-found: warn
          retention-days: 90
